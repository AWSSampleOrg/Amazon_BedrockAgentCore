Parameters:
  RuntimeCodeS3Bucket:
    Type: String

  RuntimeCodeS3Prefix:
    Type: String

Resources:
  RuntimeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*
      Policies:
        - PolicyName: Admin
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "*"
                Resource: "*"

  AgentCoreRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeArtifact:
        CodeConfiguration:
          Code:
            S3:
              Bucket: !Ref RuntimeCodeS3Bucket
              Prefix: !Ref RuntimeCodeS3Prefix
          EntryPoint:
            - main.py
          Runtime: PYTHON_3_14
      AgentRuntimeName: BedrockAgentCoreRuntime_A2A
      Description: MCP server hosted on AgentCore Runtime
      NetworkConfiguration:
        NetworkMode: PUBLIC
      # 0.0.0.0:9000/
      ProtocolConfiguration: A2A
      RoleArn: !GetAtt RuntimeExecutionRole.Arn
